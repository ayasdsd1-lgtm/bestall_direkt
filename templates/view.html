<!DOCTYPE html>
<html lang="sv">
    <head>
        <meta charset="utf-8">
        <title>Beställ Direkt</title>
        <link href="{{ url_for('static', filename='style.css') }}" type="text/css" rel="stylesheet">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=search">
        <link href="https://fonts.googleapis.com/css2?family=Rosarivo:ital@0;1&display=swap" rel="stylesheet">
    </head>
    <body>
        <div id="grid">
            <header>
                <!-- titel -->
                <a href="{{ url_for('home') }}">
                    <img src="{{ url_for('static', filename='images/bestall_direkt_logo.png') }}" alt="sidans_logo">
                </a>

                <!-- länk till inlogg-->
                <a id="for-foretag" href="{{ url_for('logga_in') }}"> För företag</a>
            </header>

            <nav class="category-nav">
                <div class="nav-wrapper">
                    <ul class="category-list">
                        <li><a href="{{ url_for('kategori', namn='Brunch') }}">Brunch</a></li>
                        <li><a href="{{ url_for('kategori', namn='Smatt-och-mingel') }}">Smått & mingel</a></li>
                        <li><a href="{{ url_for('kategori', namn='Middag-och-festmat') }}">Middag & festmat</a></li>
                        <li><a href="{{ url_for('kategori', namn='Buffe') }}">Buffé</a></li>
                        <li><a href="{{ url_for('kategori', namn='Bakver-och-sott') }}">Bakverk & sött</a></li>
                    </ul>

                    <form action="/search" method="GET">
                        <div class="search-view">
                            <span class="search--view-icon material-symbols-outlined">search</span>
                            <input class="search-input" type="search" name="search" id="search" class="input-view" placeholder="Vad vill du söka på?">
                        </div>
                    </form>
                </div>
            </nav>
            

        </div>
    </body>
</html>
