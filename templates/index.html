<!DOCTYPE html>
<html lang="sv">
    <head>
        <meta charset="utf-8">
        <title>Beställ direkt</title>
        <link href="{{ url_for('static', filename='style.css') }}" type="text/css" rel="stylesheet">
    </head>

    <body>
        <header class="header">
            <a href="/" class="site_name">
                <img src="{{ url_for('static', filename='/images/logo.') }}" alt="kockhatt" class="logo">
                <span>Beställ Direkt</span>
            </a>
            <nav class="login_link">
                <a href="{{ url_for('static', filename='login_company') }}" class="login_text">För företag</a>
            </nav>
        </header>


        <nav class="nav">
            <ul>
                <li><a href="#">Brunch</a></li>
                <li><a href="#">Smått & Mingel</a></li>
                <li><a href="#">Middag & Festmat</a></li>
                <li><a href="#">Buffé</a></li>
                <li><a href="#">Bakverk & Sött</a></li>
            </ul>
            
        </nav>

        <main class="main">

            <div class="background_search">
                <a href="#" class="search">Vad vill du boka?</a>
            </div>
            

            <div> <!--Kategorier börjar här-->
                <section class="catering">
                    <h2 id="h2_category">
                        Kategorier
                    </h2>
                    <div class="cards">
                        
                        <div class="card_column">
                            <div class="card_content">
                                <a href="#"> 
                                    <picture>
                                        <source srcset="/images/sushi.jpg" id="sushi_img">
                                        <img src="{{ url_for('static', filename='/images/sushi.jpg') }}" alt="Bild på sushi" id="sushi_img" class="cards_images">
                                    </picture>
                                    <h3>
                                        sushi
                                    </h3>
                                </a>
                            </div>
                        </div>
                        
                        <div class="card_column">
                            <div class="card_content">
                                <a href="#"> 
                                    <picture>
                                        <source srcset="/images/libanesisk.jpg" id="libanesisk_img">
                                        <img src="/images/libanesisk.jpg" alt="Bild på libanesisk mat" id="libanesisk_img" class="cards_images">
                                    </picture>
                                    <h3>
                                        Libanesisk
                                    </h3>
                                </a>
                            </div>
                        </div>

                        <div class="card_column">
                            <div class="card_content">
                                <a href="#"> 
                                    <picture>
                                        <source srcset="/images/sweets.jpg" id="sweets_img">
                                        <img src="/images/sweets.jpg" alt="Bild på bakverk" id="sweets_img" class="cards_images">
                                    </picture>
                                    <h3>
                                        Bakverk
                                    </h3>
                                </a>
                            </div>
                        </div>

                    </div>

                </section> 
            </div> <!--Kategorier slutar här-->
            




        </main>
        <aside></aside>
        <footer>
            <div id= "grid-footer">
                <h2>Beställ direkt</h2>
                <p>© Beställ direkt 2026</p>
            </div>
        </footer>
    </body>
</html>
