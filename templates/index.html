<!DOCTYPE html>
<html lang="sv">
    <head>
        <meta charset="utf-8">
        <title>Beställ Direkt - startsidan</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="{{ url_for('static', filename='style.css') }}" type="text/css" rel="stylesheet">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=search">
        <link href="https://fonts.googleapis.com/css2?family=Rosarivo:ital@0;1&display=swap" rel="stylesheet">
        <script src="{{ url_for('static', filename='script.js') }}" defer></script>
    </head>
    <body>
        <div id="grid">
            <header>
                <!-- titel -->
                <a href="{{ url_for('home') }}">
                    <img src="{{ url_for('static', filename='images/bestall_direkt_logo.png') }}" alt="sidans_logo">
                </a>

                <!-- länk till inlogg-->
                <a id="for-foretag" href="{{ url_for('logga_in') }}"> För företag</a>
            </header>

            <nav class="nav" id="home-nav">     
                <!-- sökfält från tutorial/Google Fonts -->
                <form action="/search" method="GET">
                    <div class="search">
                        <span class="search-icon material-symbols-outlined">search</span>
                        <input class="search-input" type="search" name="q" id="search" placeholder="Vad vill du boka idag?">
                    </div>
                </form>
            </nav>

            <main id="home-main">
                <!-- kategorier -->
                 <section>
                    <h2 class="catering_categori">Översikt av kategorier</h2>
                    <div id="grid-cards">
                        
                        <!-- första kategori-->
                        <article class="card">
                            <a href="{{ url_for('kategori', namn='Brunch') }}">
                                <img src="{{ url_for('static', filename='images/brunch.jpeg') }}" alt="Brunch kategori omslag">
                                <h3>Brunch</h3>
                            </a>
                        </article>

                        <article class="card">
                            <a href="{{ url_for('kategori', namn='Smatt-och-mingel') }}">
                                <img src="{{ url_for('static', filename='images/smattochmingel.jpeg') }}" alt="Smått och mingel kategori omslag">
                                <h3>Smått & mingel</h3>
                            </a>
                        </article>

                        <article class="card">
                            <a href="{{ url_for('kategori', namn='Middag-och-festmat') }}">
                                <img src="{{ url_for('static', filename='images/middagochfestmat.jpg') }}" alt="Middag och festmat kategori omslag">
                                <h3>Middag & festmat</h3>
                            </a>
                        </article>

                        <article class="card">
                            <a href="{{ url_for('kategori', namn='Buffe') }}">
                                <img src="{{ url_for('static', filename='images/buffe.jpg') }}" alt="Buffé kategori omslag">
                                <h3>Buffé</h3>
                            </a>
                        </article>

                        <article class="card">
                            <a href="{{ url_for('kategori', namn='Bakverk-och-sott') }}">
                                <img src="{{ url_for('static', filename='images/bakverkochsott.jpg') }}" alt="Bakverk och sött kategori omslag">
                                <h3>Bakverk & sött</h3>
                            </a>
                        </article>

                        <!-- sjätte kategori - visa alla kategorier-->
                        <article id="visa-fler" class="card card-all">
                                <h3>Visa alla kategorier</h3>
                        </article>

                        <article class="card extra-category">
                            <a href="{{ url_for('kategori', namn='Sushi') }}">
                                <img src="{{ url_for('static', filename='images/background.jpg') }}" alt="Sushi kategori omslag">
                                <h3>Sushi</h3>
                            </a>
                        </article>

                        <article class="card extra-category"> 
                            <a href="{{ url_for('kategori', namn='Veganskt') }}">
                                <img src="{{ url_for('static', filename='images/background.jpg') }}" alt="Veganskt kategori omslag">
                                <h3>Veganskt</h3>
                            </a>
                        </article>
                    </div>
                 </section>
            </main>

            <!-- footer skapare av April -->
            <footer>
            <section class="footer_box">
                <p><a href="{{ url_for('logga_in') }}">Företagsinloggning</a></p>
                <p><a href="{{ url_for('info', _anchor='policy') }}">Policy</a></p>
                <p><a href="{{ url_for('info', _anchor='om-oss') }}">Om Beställ Direkt</a></p>
                <p><a href="{{ url_for('info', _anchor='support') }}">Support</a></p>
                <p><a href="{{ url_for('admin_login') }}">Admin</a></p>
            </section>

            <div id="footer_bottom">
                <img src="{{ url_for('static', filename='images/bestall_direkt_logo.png') }}" alt="sidans_logo">
                <p>© Beställ direkt 2026</p>
            </div>
        </footer>
        </div>
    </body>
</html>
