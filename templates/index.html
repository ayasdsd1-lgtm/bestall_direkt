<!DOCTYPE html>
<html lang="sv">
    <head>
        <meta charset="utf-8">
        <title>Beställ Direkt</title>
        <link href="{{ url_for('static', filename='style.css') }}" type="text/css" rel="stylesheet">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=search">
    </head>
    <body>
        <div id="grid">
            <!-- header skapare av Aya -->
            <header>
                <!-- titel -->
                <img src="{{ url_for('static', filename='images/logo_gron.png') }}" alt="kockhatt">
                <h1>Beställ Direkt</h1>
                <!-- lägg till profil nedan-->

                <!-- länk till inlogg-->
                <a id="for-foretag" href="{{ url_for('logga_in') }}"> För företag</a>

            </header>

            <!-- nav skapare av April -->
            <nav>
                <!-- rubrik till sökfältet -->
                 <h2>Vad vill du boka?</h2>

                <!-- sökfält från tutorial/Google Fonts -->
                <form action="/search" method="GET">
                    <div class="search">
                        <span class="search-icon material-symbols-outlined">search</span>
                        <input class="search-input" type="search" name="q" id="search" placeholder="Sök">
                    </div>
                </form>
            </nav>

            <!-- main skapare av Maja L -->
            <main>
                <!-- kategorier -->
                 <section>
                    <h2>Översikt av kategorier</h2>
                    <div id="grid-cards">
                        <!-- första kategori-->
                        <article class="card">
                            <a href="{{ url_for('templates', filename='kategori_brunch.html') }}">
                                <img src="{{ url_for('static', filename='images/kategori_example_omslag.jpg') }}" alt="">
                                <h3>Brunch</h3>
                            </a>
                        </article>

                        <!-- andra kategori -->
                        <article class="card">
                            <a href="">
                                <img src="{{ url_for('static', filename='images/kategori_example_omslag.jpg') }}" alt="">
                                <h3>Smått & mingel</h3>
                            </a>
                        </article>

                        <!-- tredje kategori -->
                        <article class="card">
                            <a href="">
                                <img src="{{ url_for('static', filename='images/kategori_example_omslag.jpg') }}" alt="">
                                <h3>Middag & festmat</h3>
                            </a>
                        </article>

                        <!-- fjärde kategori -->
                        <article class="card">
                            <a href="">
                                <img src="{{ url_for('static', filename='images/kategori_example_omslag.jpg') }}" alt="">
                                <h3>Buffé</h3>
                            </a>
                        </article>

                        <!-- femte kategori -->
                        <article class="card">
                            <a href="">
                                <img src="{{ url_for('static', filename='images/kategori_example_omslag.jpg') }}" alt="">
                                <h3>Bakverk & sött</h3>
                            </a>
                        </article>

                        <!-- sjätte kategori -->
                        <article class="card card-all">
                            <a href="#">
                                <h3>Visa alla kategorier</h3>
                            </a>
                        </article>
                    </div>
                 </section>
            </main>

            <!-- footer skapare av April -->
            <footer>
                <h2>Beställ Direkt</h2>
                <p>© Beställ direkt 2026</p>
            </footer>
        </div>
        <h2>Logga in</h2>
        <form action="/login" method="POST">
            <input type="email" name="email" placeholder="Email">
            <input type="password" name="password" placeholder="Lösenord">
            <button type="submit">Logga in</button>
        </form>
        <h2>Registrera ny användare</h2>
        <form action="/register" method="POST">
            <input type="text" name="namn" placeholder="Företagsnamn">
             <input type="email" name="email" placeholder="Email">
             <input type="password" name="losenord" placeholder="Lösenord">
             <button type="submit">Registrera</button>
            </form>
    </body>
</html>
