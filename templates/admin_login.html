<!DOCTYPE html>
<html lang="sv">
    <head>
        <meta charset="utf-8">
        <title>Beställ Direkt - Admininloggning</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="{{ url_for('static', filename='style.css') }}" type="text/css" rel="stylesheet">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=search">
        <link href="https://fonts.googleapis.com/css2?family=Rosarivo:ital@0;1&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <header class="header-border">
                <a href="{{ url_for('home') }}">
                    <img src="{{ url_for('static', filename='images/bestall_direkt_logo.png') }}" alt="sidans_logo">
                </a>
                <a id="for-foretag" href="{{ url_for('logga_in') }}"> För företag</a>
            </header>

            <main class="login-wrapper">
                <div class="login-box">
                    <h2 class="title">Admininloggning</h2>
                    {% if fel %}
                        <p class="fel-general">{{ fel }}</p>
                    {% endif %}

                    <form class="register-form" action="{{ url_for('admin_login') }}" method="POST">

                        <label for="email">Admin E-post *</label>
                        <input  type="email" 
                                id="email" 
                                name="email" 
                                placeholder="Admin email" 
                                class="register-input" 
                                required>
                        
                        <label for="password">Lösenord *</label>
                        <input  type="password" 
                                id="password" 
                                name="password" 
                                placeholder="Lösenord" 
                                class="register-input" 
                                required>

                        <button class="login-button" type="submit">Logga in som admin</button>
                    </form>

                    <p style="margin-top: 20px;">
                        <a id="lank-till-registrering" href="{{ url_for('home') }}">Tillbaka till startsidan</a>
                    </p>
                </div>
            </main>

            <footer>
                <section class="footer_box">
                    <p><a href="{{ url_for('logga_in') }}">Företagsinloggning</a></p>
                    <p><a href="{{ url_for('info', _anchor='policy') }}">Policy</a></p>
                    <p><a href="{{ url_for('info', _anchor='om-oss') }}">Om Beställ Direkt</a></p>
                    <p><a href="{{ url_for('info', _anchor='support') }}">Support</a></p>
                    <p><a href="{{ url_for('admin_login') }}">Admin</a></p>
                </section>

                <div id="footer_bottom">
                    <img src="{{ url_for('static', filename='images/bestall_direkt_logo.png') }}" alt="sidans_logo">
                    <p>© Beställ direkt 2026</p>
                </div>
            </footer>
        </div>
    </body>
</html>
