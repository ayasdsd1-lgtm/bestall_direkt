<!DOCTYPE html>
<html lang="sv">
    <head>
        <meta charset="utf-8">
        <title>Beställ Direkt</title>
        <link href="{{ url_for('static', filename='style.css') }}" type="text/css" rel="stylesheet">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=search">
        <link href="https://fonts.googleapis.com/css2?family=Rosarivo:ital@0;1&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <header>
                <!-- titel -->
                <img src="{{ url_for('static', filename='images/bestall_direkt_logo.png') }}" alt="sidans_logo">
                <!-- lägg till profil nedan-->

                <!-- länk till inlogg-->
                <a id="for-foretag" href="{{ url_for('logga_in') }}"> För företag</a>
            </header>
            <div class="content-wrapper">
                <section class="form-section">
                    <h2 class="title"> Registrera ny Företagare </h2>
                    <form class="register-form" action="/register" method="POST"> 
                        <label for="name">Namn</label>
                        <input type="text" id="name" name="namn" placeholder="Ditt fullständiga namn.." class="register-input"></input>
                        
                        <label for="email">E-post</label>
                        <input type="email" id="email" name="email" placeholder="E-post.." class="register-input"></input>

                        <label for="password">Lösenord</label>
                        <input type="password" name="losenord" id="tel" placeholder="Lösenord" class="register-input"></input>

                        <button class="submit">Registrera</button>

                    </form>
                </section>
                <section class="design-section">
                    <img id="design" src="{{ url_for('static', filename='images/registreringssidan.png') }}" alt="Marknadsföring för sidan">
                </section>
            </div>
        </div>
    </body>

</html>
