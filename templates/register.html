<!DOCTYPE html>
<html lang="sv">
    <head>
        <meta charset="utf-8">
        <title>Beställ Direkt - Registrering</title>
        <link href="{{ url_for('static', filename='style.css') }}" type="text/css" rel="stylesheet">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=search">
        <link href="https://fonts.googleapis.com/css2?family=Rosarivo:ital@0;1&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <header class="header-border">
                <!-- titel -->
                <a href="{{ url_for('home') }}">
                    <img src="{{ url_for('static', filename='images/bestall_direkt_logo.png') }}" alt="sidans_logo">
                </a>
                <!-- lägg till profil nedan-->

                <!-- länk till inlogg-->
                <a id="for-foretag" href="{{ url_for('logga_in') }}"> För företag</a>
            </header>
            <main class="login-wrapper">
                <div class="login-box">
                    <h2 class="title"> Registrera ny Företagare </h2>
                    <form class="register-form" action="/register" method="POST"> 
                        <label for="name">Namn</label>
                        <input type="text" id="name" name="name" placeholder="Ditt fullständiga namn.." class="register-input">

                        <label for="identification">Personnummer</label>
                        <input type="text" id="identification" name="identification" placeholder="xxxx-xx-xx" class="register-input">
                        
                        <label for="email">E-post</label>
                        <input type="email" id="email" name="email" placeholder="E-post.." class="register-input">

                        <label for="tel">Mobilnummer</label>
                        <input type="tel" name="tel" id="tel" placeholder="Mobilnummer.." class="register-input">
                        
                        <label for="password">Lösenord</label>
                        <input type="password" name="losenord" id="tel" placeholder="Lösenord" class="register-input"></input>

                        <button class="login-button" type="submit">Registrera</button>
                    </form>

                    <h3>Har du redan ett konto?</h3>
                    <a id="lank-till-registrering" href="{{ url_for('logga_in') }}"> Logga in</a>
                </div>
            </main>
            <footer>
                <section class="footer_box">
                    <h2>Kontakt / info</h2>
                    <p>Bla bla blah? policy, kontakt, admin/support</p>
                </section>

                <div id="footer_bottom">
                    <img src="{{ url_for('static', filename='images/bestall_direkt_logo.png') }}" alt="kockhatt">
                    <p>© Beställ direkt 2026</p>
                </div>
            </footer>
        </div>
    </body>
</html>
