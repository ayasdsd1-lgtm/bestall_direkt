<!DOCTYPE html>
<html lang="sv">
    <head>
        <meta charset="utf-8">
        <title>Beställ Direkt - Logga in</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="{{ url_for('static', filename='style.css') }}" type="text/css" rel="stylesheet">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=search">
        <link href="https://fonts.googleapis.com/css2?family=Rosarivo:ital@0;1&display=swap" rel="stylesheet">
    </head>
    <body>
        <header class="header-border">
                <!-- titel -->
                <a href="{{ url_for('home') }}">
                    <img src="{{ url_for('static', filename='images/bestall_direkt_logo.png') }}" alt="sidans_logo">
                </a>
                <!-- lägg till profil nedan-->

                <!-- länk till inlogg-->
                <a class="for-company" href="{{ url_for('login_page') }}"> För företag</a>
        </header>
        <!--Logga in form-->
        <main class="login-wrapper">
            <div class="login-box">
                <h2>Logga in</h2>

                <!-- ← LAGT TILL: visas bara om ett felmeddelande skickas från app.py -->
                {% if error %}
                    <p class="error-message">{{ error }}</p>
                {% endif %}

                <form class="login-form" action="/login" method="POST">

                    <!-- Email -->
                    <label for="email">E-post</label>
                    <input type="email" id="email" name="email" placeholder="Email" class="login-input" required>
                    
                    <!-- Lösenord -->
                    <label for="lösenord">Lösenord</label>
                    <input type="password" id="password" name="password" placeholder="Lösenord" class="login-input" required>

                    <!-- Logg in knapp -->
                    <button class="login-button" type="submit">Logga in</button>
                </form>

                <!-- länk till registrering-->
                <h3>Har du inget konto?</h3>
                <a class="link-register" href="{{ url_for('register_page') }}"> Registrera dig</a>
            </div>
        </main>
        <footer>
            <section class="footer_box">
                <p><a href="{{ url_for('login_page') }}">Företagsinloggning</a></p>
                <p><a href="{{ url_for('info', _anchor='policy') }}">Policy</a></p>
                <p><a href="{{ url_for('info', _anchor='about-us') }}">Om Beställ Direkt</a></p>
                <p><a href="{{ url_for('info', _anchor='support') }}">Support</a></p>
                <p><a href="{{ url_for('admin_login') }}">Admin</a></p>
            </section>

            <div id="footer_bottom">
                <img src="{{ url_for('static', filename='images/bestall_direkt_logo.png') }}" alt="sidans_logo">
                <p>© Beställ direkt 2026</p>
            </div>
        </footer>
    </body> 
</html>
