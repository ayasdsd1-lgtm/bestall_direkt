<!DOCTYPE html>
<html lang="sv">
    <head>
        <meta charset="utf-8">
        <title>Kategori</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="{{ url_for('static', filename='style.css') }}" type="text/css" rel="stylesheet">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=search">
        <link href="https://fonts.googleapis.com/css2?family=Rosarivo:ital@0;1&display=swap" rel="stylesheet">
    </head>

    <body>

        <header>
            <a href="{{ url_for('home') }}">
                <img src="{{ url_for('static', filename='images/bestall_direkt_logo.png') }}" alt="sidans_logo">
            </a>
            <a id="for-foretag" href="{{ url_for('logga_in') }}">För företag</a>
        </header>

        <nav class="nav" id="kategori-nav">
            <form action="/search" method="GET">
                <div class="search">
                    <input class="search-input" type="search" name="q" placeholder="Vad vill du boka idag?">
                </div>
            </form>
        </nav>

        <main>
            <section>
                <h2>{{ namn }}</h2>

                <div id="grid-cards">
                    {% if foretag %}

                        {% for f in foretag %}
                            <article class="card">
                                <a href="{{ url_for('view_company', company_id=f[0]) }}">
                                    <img src="{{ url_for('static', filename='images/background.jpg') }}" alt="{{ f[1] }}">
                                    <h3>{{ f[1] }}</h3>

                                    {% if f[2] %}
                                        <p>{{ f[2] }}</p>
                                    {% endif %}
                                </a>
                            </article>
                        {% endfor %}

                    {% else %}

                        <p>Det finns inga verksamheter i denna kategori ännu.</p>

                    {% endif %}
                </div>
            </section>
        </main>

        <footer>
            <section class="footer_box">
                <p><a href="{{ url_for('logga_in') }}">Företagsinloggning</a></p>
                <p><a href="{{ url_for('info', _anchor='policy') }}">Policy</a></p>
                <p><a href="{{ url_for('info', _anchor='om-oss') }}">Om Beställ Direkt</a></p>
                <p><a href="{{ url_for('info', _anchor='support') }}">Support</a></p>
                <p><a href="{{ url_for('admin_login') }}">Admin</a></p>
            </section>

            <div id="footer_bottom">
                <img src="{{ url_for('static', filename='images/bestall_direkt_logo.png') }}" alt="kockhatt">
                <p>© Beställ direkt 2026</p>
            </div>
        </footer>

    </body>
</html>
