<!DOCTYPE html>
<html lang="sv">
    <head>
        <meta charset="utf-8">
        <title>Beställ Direkt</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="{{ url_for('static', filename='style.css') }}" type="text/css" rel="stylesheet">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=search">
        <link href="https://fonts.googleapis.com/css2?family=Rosarivo:ital@0;1&display=swap" rel="stylesheet">
        <script src="{{ url_for('static', filename='script.js') }}" defer></script>
    </head>
    <body>
        <header>
            <a href="{{ url_for('home') }}">
                <img src="{{ url_for('static', filename='images/bestall_direkt_logo.png') }}" alt="sidans_logo">
            </a>
            {% if session.get('user') %}
                <a class="for-company" href="{{ url_for('profile') }}">Min profil</a>
            {% else %}
                <a class="for-company" href="{{ url_for('login_page') }}">För företag</a>
            {% endif %}
        </header>
 
        <div class="create-business-wrapper">
            <section class="create-business-card">
 
                <div class="create-business-header">
                    <h1>Skapa verksamhet</h1>
                    <p>
                        Fyll i information om din verksamhet så att kunder
                        kan hitta och boka dina cateringtjänster.
                    </p>
                </div>
                     {% if success %}
                        <p class="success-message-register">{{ success }}</p>
                    {% endif %}
                <form
                    action="{{ url_for('create_business') }}"
                    method="POST"
                    class="create-business-form">

                    <div class="form-grid">
 
                        <div class="form-group">
                            <label>Verksamhetsnamn</label>
                            <input
                                type="text"
                                name="company_name"
                                placeholder="T.ex. Smakfull Catering AB"
                                required>
                        </div>
 
                        <div class="form-group">
                            <label>Kategori</label>
                            <select name="category" required>
                                <option value="">Välj kategori</option>
                                <option>Brunch</option>
                                <option>Smått & mingel</option>
                                <option>Middag & festmat</option>
                                <option>Buffé</option>
                                <option>Bakverk & sött</option>
                                <option>Vegetariskt</option>
                            </select>
                        </div>
 
                        <div class="form-group">
                            <label>Telefonnummer</label>
                            <input
                                type="text"
                                name="phone"
                                placeholder="T.ex. 070 123 45 67">
                        </div>
 
                        <div class="form-group">
                            <label>E-postadress</label>
                            <input
                                type="text"
                                name="email"
                                placeholder="T.ex. kontakt@foretag.se">
                        </div>

                        <div class="form-group">
                            <label>Adress</label>
                            <input
                                type="text"
                                name="address"
                                placeholder="T.ex. Storgatan 1, Malmö"
                                required>
                        </div>
 
                    </div>
 
                    <div class="form-group full-width">
                        <label>Beskrivning</label>
                        <textarea
                            name="description"
                            placeholder="Berätta om din verksamhet, vad ni erbjuder och vad som gör er unika..."
                        ></textarea>
                    </div>
 
                    <button type="submit" class="create-business-btn">
                        Skapa verksamhet
                    </button>
 
                </form>
 
            </section>
        </div>
    </body>
</html>
